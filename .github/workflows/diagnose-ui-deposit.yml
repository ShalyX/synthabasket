name: Diagnose UI Deposit

on:
  workflow_dispatch:
    inputs:
      signature:
        description: Solana Devnet acquisition/deposit transaction signature to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      UI_ACQUISITION_SIGNATURE: ${{ inputs.signature }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Diagnose UI deposit transaction
        run: npx tsx scripts/diagnose-ui-deposit.ts
