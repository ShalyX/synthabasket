[package]
name = "synthabasket_vault"
version = "0.1.0"
description = "On-Chain Solvency Vault & Basket Mint Authority for SynthaBasket Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "synthabasket_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.26"
# Keep the Solana 1.18 SBF toolchain on a pre-edition-2024 indexmap.
indexmap = "=2.6.0"
